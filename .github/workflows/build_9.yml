name: Build Stock/Plain Kernel Cepheus

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: JoK3rLeE/android_kernel_xiaomi_sm8150
        ref: 17.0-cepheus
        fetch-depth: 1

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev \
          libelf-dev zip unzip curl git ccache repo rawtherapee

    - name: Download Toolchains (Clang & GCC)
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains

        # Download Clang r563880c (Clang 21) dari AOSP Prebuilts
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r563880c.tar.gz -O clang.tar.gz
        
        # Ekstrak dengan penanganan archive googlesource
        mkdir clang
        tar -xzf clang.tar.gz -C clang || tar -xf clang.tar.gz -C clang
        rm -f clang.tar.gz

        # Download GCC 64-bit & 32-bit Cross-Compilers
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android12-release --depth=1 gcc64
        git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 -b android12-release --depth=1 gcc32

    - name: Build Kernel
      run: |
        export PATH="$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export LLVM=1
        export LLVM_IAS=1
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        mkdir -p out
        make O=out cepheus_defconfig
        make -j$(nproc --all) O=out

    - name: Check Build Output
      run: |
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "IMAGE_TYPE=Image.gz-dtb" >> $GITHUB_ENV
        elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
          echo "IMAGE_TYPE=Image.gz" >> $GITHUB_ENV
        else
          echo "Kernel image tidak ditemukan! Kompilasi gagal."
          exit 1
        fi

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AK3
        rm -rf AK3/.git

        # Copy hasil build ke AK3
        if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
          cp out/arch/arm64/boot/Image.gz-dtb AK3/
        else
          cp out/arch/arm64/boot/Image.gz AK3/
        fi

        # Adjust AnyKernel3 config
        sed -i 's/device.name1=.*/device.name1=cepheus/' AK3/anykernel.sh

        cd AK3
        zip -r9 ../cepheus-kernel-plain.zip *

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cepheus-kernel-plain
        path: cepheus-kernel-plain.zip
