# Kernel cepheus - JoK3rLeE source, PLAIN (TANPA SukiSU-Ultra/SUSFS/KSU)
#
# Eksperimen isolasi: build kernel branch 17.0-cepheus TANPA nyalain
# CONFIG_KSU/CONFIG_KSU_SUSFS sama sekali. drivers/kernelsu tetap ada di
# source (bundled), tapi karena CONFIG_KSU gak di-set, seluruh driver itu
# gak ikut ke-compile - jadi ini kernel paling "bersih" yang bisa kita
# hasilkan dari source ini, buat mastiin apakah root modification yang
# bikin bootloop, atau ada masalah lain yang lebih dalam.
#
# Semua fix build yang udah kekonfirmasi perlu tetap dipertahankan:
# dma-mapping.c, andromeda exclusion, dtc swap, EROFS_FS, pstore,
# NR_CPUS, touchscreen, LTO_NONE, toolchain Clang 21 (r563880c).

name: Kernel cepheus - JoK3rLeE PLAIN (no KSU)

on:
  workflow_dispatch:

env:
  KERNEL_SOURCE: "https://github.com/JoK3rLeE/android_kernel_xiaomi_sm8150"
  KERNEL_BRANCH: "17.0-cepheus"
  BASE_DEFCONFIG: "arch/arm64/configs/vendor/sm8150-perf_defconfig"
  DEVICE_FRAGMENT: "arch/arm64/configs/vendor/xiaomi/cepheus.config"
  KERNEL_ARCH: "arm64"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo sendiri
        uses: actions/checkout@v4

      - name: Clone kernel source (JoK3rLeE)
        run: |
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "${{ env.KERNEL_SOURCE }}" kernel

      - name: Fix dma-mapping.c unused-function (bug upstream, forward decl nyangkut)
        working-directory: kernel
        run: |
          sed -i '/^static struct page \*\*__atomic_get_pages(void \*addr);$/d; /^static struct page \*\*__iommu_get_pages(void \*cpu_addr, unsigned long attrs);$/d' arch/arm64/mm/dma-mapping.c
          grep -c "__atomic_get_pages(void \*addr);" arch/arm64/mm/dma-mapping.c || echo "[+] Forward declaration nyangkut sudah dihapus."

      - name: Keluarin device andromeda yang dtsi-nya syntax error (bukan device kita, ikut ke-build bareng karena CONFIG_BUILD_ARM64_DT_OVERLAY)
        working-directory: kernel
        run: |
          sed -i '/andromeda-sm8150/d' arch/arm64/boot/dts/qcom/Makefile
          grep -c "andromeda-sm8150" arch/arm64/boot/dts/qcom/Makefile || echo "[+] andromeda sudah dikeluarkan dari daftar build."

      - name: Ganti file logika dtc dengan versi dari 16.0-cepheus (dtc 17.0-cepheus gagal parse plugin/overlay &label{})
        working-directory: kernel
        run: |
          rm -rf /tmp/dtc16
          git clone --depth=1 -b 16.0-cepheus "${{ env.KERNEL_SOURCE }}" /tmp/dtc16
          for f in checks.c dtc-lexer.l dtc-lexer.lex.c_shipped dtc-parser.tab.c_shipped dtc-parser.y dtc.c dtc.h flattree.c livetree.c srcpos.c srcpos.h util.h; do
            cp "/tmp/dtc16/scripts/dtc/$f" "scripts/dtc/$f"
          done
          rm -rf /tmp/dtc16

      - name: Buat fragment config (TANPA KSU/SUSFS sama sekali)
        working-directory: kernel
        run: |
          cat > plain_extra.config << 'EOF'
          CONFIG_NR_CPUS=8
          # CONFIG_TOUCHSCREEN_ST is not set
          CONFIG_LTO_NONE=y
          # CONFIG_LTO_CLANG is not set
          CONFIG_MFD_SPK_ID=y
          CONFIG_PSTORE=y
          CONFIG_PSTORE_RAM=y
          CONFIG_PSTORE_CONSOLE=y
          CONFIG_PSTORE_PMSG=y
          CONFIG_EROFS_FS=y
          CONFIG_EROFS_FS_XATTR=y
          CONFIG_EROFS_FS_POSIX_ACL=y
          CONFIG_EROFS_FS_SECURITY=y
          CONFIG_EROFS_FS_ZIP=y
          # CONFIG_KSU is not set
          EOF
          cat plain_extra.config

      - name: Merge defconfig (base + fragment cepheus + fragment plain)
        working-directory: kernel
        run: |
          export ARCH=arm64
          mkdir -p out
          scripts/kconfig/merge_config.sh -O out \
            "${{ env.BASE_DEFCONFIG }}" \
            "${{ env.DEVICE_FRAGMENT }}" \
            plain_extra.config
          echo "=== Cek hasil merge ==="
          grep "CONFIG_KSU\|CONFIG_MACH_XIAOMI_CEPHEUS\|CONFIG_ARM64=y\|CONFIG_NR_CPUS\|CONFIG_EROFS_FS=y" out/.config

      - name: Update localversion
        working-directory: kernel
        run: |
          sed -i 's/CONFIG_LOCALVERSION=".*"/CONFIG_LOCALVERSION="-JLPlain"/' out/.config
          grep "CONFIG_LOCALVERSION" out/.config

      - name: Install toolchain (Clang 21 / r563880c - PERSIS sama kayak kernel yang lagi jalan di device)
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev libelf-dev build-essential gcc-aarch64-linux-gnu

          echo "=== Download clang-r563880c (AOSP resmi, cocok sama build string kernel yang jalan) via sparse git clone di commit spesifik ==="
          mkdir -p toolchain
          git clone --filter=blob:none --sparse --no-checkout https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 clang_repo
          cd clang_repo
          git fetch --depth=1 origin f8439f0628d799092dd07df440a6334cab28939c
          git checkout FETCH_HEAD
          git sparse-checkout set clang-r563880c
          cd ..
          ls clang_repo/
          mv clang_repo/clang-r563880c toolchain/clang
          rm -rf clang_repo

          echo "=== Verifikasi ==="
          toolchain/clang/bin/clang --version

          echo "TOOLCHAIN_CLANG=$PWD/toolchain/clang/bin" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3
          echo "=== Ganti anykernel.sh & ak3-core.sh bawaan (generic, buat OMAP/tuna) dengan punya InfiniR (proven working buat cepheus) ==="
          cp anykernel.sh AnyKernel3/anykernel.sh
          cp ak3-core.sh AnyKernel3/tools/ak3-core.sh
          cat AnyKernel3/anykernel.sh

      - name: Fix yamltree.c (stub, buat host toolchain baru)
        working-directory: kernel
        run: |
          cat > scripts/dtc/yamltree.c << 'CEOF'
          #include <stdio.h>
          #include <stdlib.h>

          struct dt_info;

          void dt_to_yaml(FILE *outf, struct dt_info *dti) {}
          CEOF

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$TOOLCHAIN_CLANG:$PATH"
          export ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make O=out ARCH=arm64 olddefconfig
          make ARCH=arm64 O=out CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
               LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
               -j"$(nproc --all)" Image.gz-dtb

          ls out/arch/arm64/boot/Image.gz-dtb
          ls out/arch/arm64/boot/Image

      - name: Kumpulin semua file .rej (jaga-jaga)
        if: always()
        working-directory: kernel
        run: |
          mkdir -p ../rej_collected
          find . -name "*.rej" -exec cp --parents {} ../rej_collected/ \; 2>/dev/null || true
          COUNT=$(find ../rej_collected -name "*.rej" | wc -l)
          echo "[+] Ditemukan $COUNT file .rej"

      - name: Pack AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cp kernel/out/arch/arm64/boot/Image kernel-pure.img
          cd AnyKernel3 && zip -r9 ../cepheus_JoK3rLeE_Plain.zip * -x README

      - name: Upload hasil build
        uses: actions/upload-artifact@v4
        with:
          name: cepheus-JoK3rLeE-Plain
          path: |
            cepheus_JoK3rLeE_Plain.zip
            kernel/out/arch/arm64/boot/Image.gz-dtb
            kernel-pure.img

      - name: Upload .rej files (kalau ada)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rej-files
          path: rej_collected/
          if-no-files-found: ignore
